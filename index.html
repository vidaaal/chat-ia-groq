<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat IA - Groq</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #e5e5e5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .logo {
      font-weight: 600;
      font-size: 1.1rem;
      color: #fff;
    }

    .logo span {
      color: #f97316;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    input, select, button {
      background: #262626;
      border: 1px solid #404040;
      color: #e5e5e5;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #f97316;
    }

    #apiKey {
      width: 280px;
      font-family: monospace;
      font-size: 0.85rem;
    }

    button {
      background: #f97316;
      border: none;
      color: white;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }

    button:hover {
      background: #ea580c;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 600;
      flex-shrink: 0;
    }

    .user .avatar {
      background: #3b82f6;
    }

    .assistant .avatar {
      background: #f97316;
    }

    .bubble {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 12px 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user .bubble {
      background: #1e3a5f;
      border-color: #2563eb;
    }

    .typing {
      color: #888;
      font-style: italic;
    }

    footer {
      background: #1a1a1a;
      border-top: 1px solid #333;
      padding: 16px 20px;
    }

    .input-area {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }

    #userInput {
      flex: 1;
      resize: none;
      min-height: 48px;
      max-height: 150px;
      padding: 12px 16px;
      line-height: 1.4;
    }

    .status {
      max-width: 800px;
      margin: 8px auto 0;
      font-size: 0.8rem;
      color: #888;
      text-align: center;
    }

    .error {
      color: #f87171;
    }

    .model-badge {
      background: #262626;
      border: 1px solid #404040;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #a3a3a3;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Chat <span>IA</span> · Groq</div>
    <div class="controls">
      <input type="password" id="apiKey" placeholder="Cole sua chave da Groq aqui..." />
      <div class="model-badge">openai/gpt-oss-120b</div>
      <button onclick="salvarChave()">Salvar chave</button>
      <button onclick="limparChat()" style="background:#404040">Limpar</button>
    </div>
  </header>

  <div id="chat"></div>

  <footer>
    <div class="input-area">
      <textarea id="userInput" placeholder="Digite sua mensagem... (Enter para enviar)" rows="1"></textarea>
      <button id="sendBtn" onclick="enviar()">Enviar</button>
    </div>
    <div class="status" id="status"></div>
  </footer>

  <script>
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('userInput');
    const statusEl = document.getElementById('status');
    const apiKeyEl = document.getElementById('apiKey');
    const sendBtn = document.getElementById('sendBtn');

    const MODEL = 'openai/gpt-oss-120b';

    let historico = [];
    let enviando = false;

    // Carrega chave salva
    const chaveSalva = localStorage.getItem('groq_api_key');
    if (chaveSalva) {
      apiKeyEl.value = chaveSalva;
      statusEl.textContent = 'Chave carregada ✓';
    }

    function salvarChave() {
      const chave = apiKeyEl.value.trim();
      if (!chave) {
        statusEl.innerHTML = '<span class="error">Cole a chave primeiro</span>';
        return;
      }
      localStorage.setItem('groq_api_key', chave);
      statusEl.textContent = 'Chave salva com sucesso ✓';
    }

    function limparChat() {
      historico = [];
      chatEl.innerHTML = '';
      statusEl.textContent = '';
    }

    function adicionarMensagem(role, texto) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.innerHTML = `
        <div class="avatar">${role === 'user' ? 'Você' : 'IA'}</div>
        <div class="bubble">${texto}</div>
      `;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div.querySelector('.bubble');
    }

    async function enviar() {
      const texto = inputEl.value.trim();
      if (!texto || enviando) return;

      const apiKey = apiKeyEl.value.trim() || localStorage.getItem('groq_api_key');
      if (!apiKey) {
        statusEl.innerHTML = '<span class="error">Cole e salve sua chave da Groq primeiro</span>';
        return;
      }

      enviando = true;
      sendBtn.disabled = true;
      inputEl.value = '';
      statusEl.textContent = 'Gerando resposta...';

      adicionarMensagem('user', texto);
      historico.push({ role: 'user', content: texto });

      // Cria a bolha da IA vazia para ir preenchendo (streaming)
      const bubble = adicionarMensagem('assistant', '');
      bubble.classList.add('typing');
      bubble.textContent = '';

      let respostaCompleta = '';

      try {
        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: MODEL,
            messages: [
              { role: 'system', content: 'Você é um assistente útil, amigável e responde em português brasileiro de forma clara e natural.' },
              ...historico
            ],
            temperature: 1,
            max_completion_tokens: 2048,
            top_p: 1,
            stream: true
          })
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.error?.message || `Erro ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          const lines = chunk.split('\n').filter(line => line.trim() !== '');

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = line.slice(6);
              if (data === '[DONE]') continue;

              try {
                const parsed = JSON.parse(data);
                const content = parsed.choices?.[0]?.delta?.content;
                if (content) {
                  respostaCompleta += content;
                  bubble.classList.remove('typing');
                  bubble.textContent = respostaCompleta;
                  chatEl.scrollTop = chatEl.scrollHeight;
                }
              } catch (e) {
                // ignora linhas inválidas
              }
            }
          }
        }

        if (respostaCompleta) {
          historico.push({ role: 'assistant', content: respostaCompleta });
        } else {
          bubble.textContent = '(sem resposta)';
        }

        statusEl.textContent = '';
      } catch (err) {
        bubble.textContent = 'Erro ao gerar resposta.';
        statusEl.innerHTML = `<span class="error">Erro: ${err.message}</span>`;
        console.error(err);
      } finally {
        enviando = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    // Enter para enviar (Shift+Enter = nova linha)
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        enviar();
      }
    });

    // Auto-resize do textarea
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 150) + 'px';
    });
  </script>
</body>
</html>
